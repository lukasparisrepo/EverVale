services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: evervale
      POSTGRES_PASSWORD: evervale
      POSTGRES_DB: evervale
    ports:
      - "5432:5432"
    volumes:
      - evervale_pg:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro

volumes:
  evervale_pg:
