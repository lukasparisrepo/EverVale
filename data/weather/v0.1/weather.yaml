version: "0.1"

calendar:
  season_duration_real_seconds_at_1x: 604800
  season_order: [SPRING, SUMMER, AUTUMN, WINTER]

episode_duration_minutes:
  normal_min: 20
  normal_max: 120
  severe_min: 15
  severe_max: 60

severe:
  cooldown_real_hours_min: 8
  max_offline_severe_events_per_24h: 2
  critical_building_delete_allowed: false

