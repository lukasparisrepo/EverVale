    fog_mult: 1.15
    heavy_rain_visual_mult: 1.10
  hill_country:
    wind_mult: 1.15
  lakeside:
    fog_mult: 1.25
  forest_basin:
    fallen_tree_risk_mult: 1.20
  coastal_ridge:
    wind_mult: 1.25
    severe_storm_mult: 1.10

