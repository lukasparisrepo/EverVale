version: "0.1"

settlement_score:
  formula: "population*2 + operational_buildings*6 + tech_tier_bonus"
  military_units_contribute: false
  tech_tier_bonus:
    0: 0
    1: 60
    2: 150
    3: 280
    4: 450
    5: 700

threat_tiers:
  0:
    score_min: 0
    score_max: 119
    required_tech_min: 0
    budget_min: 12
    budget_max: 30
    roster: [nibbler, critter, raider]
    max_air_units: 0

  1:
    score_min: 120
    score_max: 249
    required_tech_min: 1
    budget_min: 25
    budget_max: 55
    roster: [nibbler, critter, raider, brute]
    max_air_units: 0

  2:
    score_min: 250
    score_max: 449
    required_tech_min: 2
    budget_min: 45
    budget_max: 85
    roster: [critter, raider, brute, burrower, drone, jelly_ufo]
    max_air_units: 2

  3:
    score_min: 450
    score_max: 699
    required_tech_min: 3
    budget_min: 75
    budget_max: 125
    roster: [raider, brute, burrower, drone, jelly_ufo, tripod_walker]
    max_air_units: 3

  4:
    score_min: 700
    score_max: 999
    required_tech_min: 4
    budget_min: 110
    budget_max: 180
    roster: [brute, burrower, drone, jelly_ufo, ufo_raider, tripod_walker, carrier]
    max_air_units: 5

  5:
    score_min: 1000
    score_max: 1399
    required_tech_min: 5
    budget_min: 160
    budget_max: 260
    roster: [drone, ufo_raider, tripod_walker, carrier]
    max_air_units: 7

  6:
    score_min: 1400
    score_max: null
    required_tech_min: 5
    budget_min: 240
    budget_max: 380
    roster: [drone, ufo_raider, tripod_walker, carrier, mothership_fragment]
    boss_like: true
    occurrence_weight: 0.20

counter_gating:
  watchtower_handles_light_air_from_tier: 1
  heavy_air_requires_one_of:
    - anti_air
    - fighter
    - interceptor
  giant_ground_requires_one_of:
    - tank
    - heavy_turret
    - beam_tank
  if_hard_counter_missing:
    downgrade_wave_tier: true

composition:
  avoid_same_template_consecutively: true
  simultaneous_actor_cap: 18
  prefer_mixed_behavior: true
  min_recovery_cycles_after_major: 6

templates:
  t0_nibbler_rumpus:
    tier: 0
    units:
      nibbler: [3, 5]

  t0_critters:
    tier: 0
    units:
      critter: [3, 5]
      raider: [0, 1]

  t1_brute_intro:
    tier: 1
    units:
      raider: [2, 3]
      brute: [1, 1]

  t2_scout_sky:
    tier: 2
    units:
      raider: [2, 4]
      drone: [1, 1]
      jelly_ufo: [0, 1]

  t2_burrow:
    tier: 2
    units:
      burrower: [1, 2]
      critter: [2, 4]

  t3_tripod_intro:
    tier: 3
    units:
      tripod_walker: [1, 1]
      raider: [2, 4]
      drone: [0, 2]

  t4_ufo_assault:
    tier: 4
    units:
      ufo_raider: [1, 2]
      drone: [2, 4]
      brute: [0, 2]

  t5_carrier:
    tier: 5
    units:
      carrier: [1, 1]
      ufo_raider: [1, 2]
      drone: [2, 5]

  t6_fragment_event:
    tier: 6
    units:
      mothership_fragment: [1, 1]
      carrier: [0, 1]
      ufo_raider: [1, 2]
      drone: [2, 5]
