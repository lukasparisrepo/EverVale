version: "0.1"

rules:
  risk_min: 0.0
  risk_max: 1.0
  condition_risk_weight: 0.45
  understaffing_risk_weight: 0.20
  overload_risk_weight: 0.20
  weather_risk_weight: 0.15
  offline_major_local_incident_cap_per_24h: 4

incidents:
  rats:
    severity: low
    duration_cycles: [1, 3]
    effects:
      efficiency_mult: 0.85
      happiness_local: -4
    counters: [service_yard, maintenance]
    eligible: [house_small, house_medium, row_housing, workshop, restaurant, market, cafe, farm, school]

  kitchen_fire:
    severity: medium
    duration_cycles: [1, 2]
    effects:
      operation_mult: 0.0
      condition_damage: [8, 20]
      happiness_local: -5
    counters: [fire_station, water_available]
    eligible: [restaurant, cafe, inn]

  building_fire:
    severity: medium
    duration_cycles: [1, 3]
    effects:
      operation_mult: 0.0
      condition_damage: [10, 30]
    counters: [fire_station, water_available]
    eligible: [house_small, house_medium, workshop, farm, vehicle_factory, storehouse]

  generator_fault:
    severity: medium
    duration_cycles: [1, 3]
    effects:
      output_mult: 0.35
      condition_damage: [3, 12]
    counters: [maintenance, service_yard]
    eligible: [power_plant]

  overload:
    severity: medium
    trigger_bias:
      power_demand_ratio_gt: 0.95
    duration_cycles: [1, 2]
    effects:
      output_mult: 0.60
      condition_damage: [4, 14]
    counters: [spare_power_capacity, maintenance]
    eligible: [power_plant, varum_shield]

  pump_failure:
    severity: medium
    duration_cycles: [1, 3]
    effects:
      output_mult: 0.25
      condition_damage: [3, 10]
    counters: [maintenance, service_yard]
    eligible: [water_plant]

  contamination:
    severity: medium
    duration_cycles: [1, 2]
    effects:
      output_mult: 0.50
      happiness_global: -3
    counters: [maintenance, clinic]
    eligible: [water_plant, water_storage]

  cave_in:
    severity: high
    duration_cycles: [2, 5]
    effects:
      output_mult: 0.0
      condition_damage: [10, 25]
    counters: [builders_yard, service_yard]
    eligible: [varum_mine, service_tunnel]

  varum_anomaly:
    severity: high
    duration_cycles: [1, 4]
    effects:
      output_mult: 0.50
      threat_pressure_bonus: 2.0
      condition_damage: [3, 15]
    counters: [research_lab, radar]
    eligible: [varum_mine, varum_storage, advanced_factory, varum_shield]

  explosion:
    severity: high
    rare: true
    duration_cycles: [2, 4]
    effects:
      operation_mult: 0.0
      condition_damage: [20, 45]
      nearby_condition_damage: [0, 12]
    counters: [fire_station, maintenance]
    eligible: [power_plant, varum_mine, vehicle_factory, advanced_factory]

  fallen_tree:
    severity: low
    duration_cycles: [1, 2]
    effects:
      path_block: true
    counters: [builders_yard, service_yard]
    eligible: [road_dirt, road_stone, park]

  lift_fault:
    severity: medium
    duration_cycles: [1, 3]
    effects:
      access_disabled: true
    counters: [service_yard, maintenance]
    eligible: [hill_lift]

  animal_escape:
    severity: low
    duration_cycles: [1, 2]
    effects:
      efficiency_mult: 0.90
      happiness_local: 1
    counters: [farm_workers]
    eligible: [farm]

  litter:
    severity: low
    duration_cycles: [1, 2]
    effects:
      happiness_local: -2
    counters: [service_yard]
    eligible: [park, market, sports_green]
