version: "0.1"

world:
  size_m: [300, 300]
  terrace_count_min: 3
  terrace_count_max: 5
  starter_terrace: 0

fairness:
  starter_buildable_area_min_m2: 4200
  expansion_routes_min: 2
  first_varum_access_tier_max: 1
  max_first_varum_route_cost: 160
  threat_entry_corridors_min: 3
  reroll_invalid_seed: true
  validation_sample_target: 1000

terrain_archetypes:
  - river_valley
  - hill_country
  - lakeside
  - forest_basin
  - coastal_ridge

blockers:
  loose_rubble:
    tier: 0
    money_cost: 80
    clear_cycles: 1
    removable: true
  fallen_tree:
    tier: 0
    money_cost: 60
    clear_cycles: 1
    removable: true
  dense_forest:
    tier: 0
    money_cost: 180
    clear_cycles: 2
    removable: true
  boulder_field:
    tier: 1
    money_cost: 320
    clear_cycles: 3
    removable: true
  collapsed_road:
    tier: 1
    money_cost: 260
    clear_cycles: 2
    removable: true
  old_ruins:
    tier: 1
    money_cost: 400
    clear_cycles: 4
    removable: true
  varum_scar:
    tier: 1
    money_cost: 500
    clear_cycles: 4
    removable: true
  cliff_face:
    tier: 99
    removable: false
    requires_access_solution: true

access:
  pedestrian:
    - footpath
    - road_dirt
    - road_stone
    - road_main
    - stairs
    - bridge
    - hill_lift
    - service_tunnel
  civilian_vehicle:
    - road_dirt
    - road_stone
    - road_main
    - bridge
    - hill_lift
    - service_tunnel
  heavy_vehicle:
    - road_main
    - heavy_bridge
    - heavy_lift
    - service_tunnel

starter:
  population: 12
  buildings:
    town_center: 1
    house_small: 3
    power_plant: 1
    water_plant: 1
    workshop: 1
  roads:
    connected: true
    total_length_m_min: 70
    total_length_m_max: 130
  nearby_features:
    light_blockers_min: 1
    forest_patch: true
    visible_higher_terrace: true
    first_varum_hint: true
